# This workflow defines the environment for Copilot to build and test the repo.
# It mirrors the CI setup in .github/workflows/ci.yml.

name: Copilot Setup Steps

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  copilot-setup:
    name: Setup for Copilot
    runs-on: macos-latest
    steps:
      # Checkout — fetch-depth 0 needed for git history and ABI validation.
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      # Java 21 (pinned per ADR-0007).
      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      # Android SDK — the KMP AGP 9.x plugin requires it even for JVM-only tasks.
      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
      - name: Install Android SDK packages
        run: |
          sdkmanager --channel=3 "platforms;android-37.0" "build-tools;37.0.0"

      # Install dependencies — no separate step needed; Gradle resolves from
      # the version catalog (gradle/libs.versions.toml) and the locked wrapper.
      - name: Install dependencies
        run: ./gradlew :crypto:dependencies --no-daemon --parallel

      # Build verification — same quality gate as CI.
      - name: Build
        run: ./gradlew :crypto:compileKotlinMetadata --no-daemon --parallel
