name: Publish

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  publish:
    name: Publish to Maven Central
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
      - name: Install Android SDK packages
        run: |
          sdkmanager --channel=3 "platforms;android-37.0" "build-tools;37.0.0"
      - name: Grant execute permission for gradlew
        run: chmod +x gradlew
      - name: Validate PGP signing key
        env:
          SIGNING_KEY: ${{ secrets.SIGNING_KEY }}
        run: |
          echo "SIGNING_KEY length: ${#SIGNING_KEY}"
          echo "Has PGP headers: $(echo "$SIGNING_KEY" | grep -c 'BEGIN PGP')"
          echo "Has literal backslash-n: $(echo "$SIGNING_KEY" | grep -c '\\n')"

          # Write raw key to file
          printf '%s\n' "$SIGNING_KEY" > /tmp/signing-key-raw.asc

          # Try as-is
          if gpg --batch --import --import-options show-only /tmp/signing-key-raw.asc 2>/dev/null; then
            echo "Key is valid as-is"
            exit 0
          fi

          # Try with PGP headers added
          if ! grep -q 'BEGIN PGP' /tmp/signing-key-raw.asc; then
            printf '-----BEGIN PGP PRIVATE KEY BLOCK-----\n\n%s\n-----END PGP PRIVATE KEY BLOCK-----\n' \
              "$(cat /tmp/signing-key-raw.asc)" > /tmp/signing-key-headers.asc
            if gpg --batch --import --import-options show-only /tmp/signing-key-headers.asc 2>/dev/null; then
              echo "Key is valid with headers added"
              exit 0
            fi
          fi

          # Try converting literal \n to actual newlines
          printf '%b' "$SIGNING_KEY" > /tmp/signing-key-converted.asc
          if gpg --batch --import --import-options show-only /tmp/signing-key-converted.asc 2>/dev/null; then
            echo "Key is valid with newline conversion"
            exit 0
          fi

          echo "ERROR: PGP key cannot be parsed in any format"
          echo "The SIGNING_KEY secret appears to be malformed."
          echo "Please re-export your PGP key with:"
          echo "  gpg --armor --export-secret-keys YOUR_KEY_ID > key.asc"
          echo "And copy the ENTIRE file contents (including BEGIN/END headers) into the SIGNING_KEY secret."
          exit 1
      - name: Check Sonatype credentials
        env:
          MAVEN_CENTRAL_USERNAME: ${{ secrets.MAVEN_CENTRAL_USERNAME }}
          MAVEN_CENTRAL_PASSWORD: ${{ secrets.MAVEN_CENTRAL_PASSWORD }}
        run: |
          echo "=== Testing Central Portal OSSRH Staging API ==="
          # The OSSRH Staging API is the Central Portal's compatibility endpoint
          # for publishers migrating from legacy OSSRH (s01.oss.sonatype.org).
          # Credentials must be Central Portal User Tokens, not legacy OSSRH tokens.
          # See: https://central.sonatype.org/publish/publish-portal-ossrh-staging-api/
          STATUS=$(curl -sS -o /tmp/ossrh-status.txt -w '%{http_code}' \
            -u "$MAVEN_CENTRAL_USERNAME:$MAVEN_CENTRAL_PASSWORD" \
            -H "Accept: application/json" \
            "https://ossrh-staging-api.central.sonatype.com/service/local/staging/profiles")
          echo "OSSRH Staging API staging profiles: $STATUS"
          echo "  Response: $(head -c 500 /tmp/ossrh-status.txt)"

          if [ "$STATUS" -eq 401 ]; then
            echo "::error::Credentials rejected (401). You need a Central Portal User Token,"
            echo "not a legacy OSSRH token. Generate one at https://central.sonatype.com/"
            exit 1
          elif [ "$STATUS" -eq 200 ]; then
            echo "Credentials are valid for Central Portal OSSRH Staging API"
          else
            echo "Unexpected status: $STATUS"
          fi
      - name: Drop stale staging repositories
        # The OSSRH Staging API may leave repositories in "closed" state from
        # previous failed publishes. Drop them before a new publish to avoid
        # "Repository is in state closed and must be dropped" errors.
        # See: https://central.sonatype.org/publish/publish-portal-ossrh-staging-api/
        if: success()
        env:
          MAVEN_CENTRAL_USERNAME: ${{ secrets.MAVEN_CENTRAL_USERNAME }}
          MAVEN_CENTRAL_PASSWORD: ${{ secrets.MAVEN_CENTRAL_PASSWORD }}
        run: |
          echo "=== Listing staging repositories ==="
          STATUS=$(curl -sS -o /tmp/staged-status.txt -w '%{http_code}' \
            -u "$MAVEN_CENTRAL_USERNAME:$MAVEN_CENTRAL_PASSWORD" \
            -H "Accept: application/json" \
            "https://ossrh-staging-api.central.sonatype.com/manual/search/repositories")
          echo "Search status: $STATUS"
          echo "Response: $(cat /tmp/staged-status.txt)"
          # Extract closed repo keys using jq (avoids Python heredoc YAML issues)
          REPOS=""
          if [ "$STATUS" = "200" ]; then
            REPOS=$(jq -r '.repositories[]|select(.state=="closed")|.key' \
              /tmp/staged-status.txt 2>/dev/null)
          fi
          if [ -z "$REPOS" ]; then
            echo "No closed staging repositories to drop."
          else
            for repo in $REPOS; do
              echo "Dropping stale repository: $repo"
              DROP_STATUS=$(curl -sS -o /tmp/drop-status.txt -w '%{http_code}' \
                -u "$MAVEN_CENTRAL_USERNAME:$MAVEN_CENTRAL_PASSWORD" \
                -H "Accept: application/json" \
                -X DELETE \
                "https://ossrh-staging-api.central.sonatype.com/manual/drop/repository/$repo")
              echo "Drop status: $DROP_STATUS"
              echo "Response: $(cat /tmp/drop-status.txt)"
            done
          fi
      - name: Build and publish
        # Signing config is passed via env vars (not -P flags) because
        # SIGNING_KEY is a multi-line PGP key block that breaks shell
        # command line expansion. The signing block normalizes line endings,
        # converts literal \n escape sequences to real newlines, and auto-wraps
        # keys missing PGP ASCII armor headers. keyId is passed as null so the
        # plugin extracts it from the PGP private key block itself.
        # The publishing repository was migrated from s01.oss.sonatype.org
        # (legacy OSSRH, returns HTTP 402 when account is on Central Portal)
        # to ossrh-staging-api.central.sonatype.com (Central Portal OSSRH
        # Staging API compatibility endpoint).
        env:
          MAVEN_CENTRAL_USERNAME: ${{ secrets.MAVEN_CENTRAL_USERNAME }}
          MAVEN_CENTRAL_PASSWORD: ${{ secrets.MAVEN_CENTRAL_PASSWORD }}
          SIGNING_KEY: ${{ secrets.SIGNING_KEY }}
          SIGNING_KEY_PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD }}
        run: ./gradlew :crypto:publish
      - name: Search for staged repositories (diagnostic)
        # Lists all staging repositories on the OSSRH Staging API to verify
        # the upload created one before we attempt the transfer.
        # See: https://central.sonatype.org/publish/publish-portal-ossrh-staging-api/
        if: success()
        env:
          MAVEN_CENTRAL_USERNAME: ${{ secrets.MAVEN_CENTRAL_USERNAME }}
          MAVEN_CENTRAL_PASSWORD: ${{ secrets.MAVEN_CENTRAL_PASSWORD }}
        run: |
          echo "=== Searching for staged repositories ==="
          STATUS=$(curl -sS -o /tmp/staged-status.txt -w '%{http_code}' \
            -u "$MAVEN_CENTRAL_USERNAME:$MAVEN_CENTRAL_PASSWORD" \
            -H "Accept: application/json" \
            "https://ossrh-staging-api.central.sonatype.com/manual/search/repositories")
          echo "Search status: $STATUS"
          echo "Response: $(cat /tmp/staged-status.txt)"
      - name: Transfer deployment to Central Portal
        # After uploading artifacts via the OSSRH Staging API, the Central
        # Portal requires an explicit POST to transfer the staged deployment
        # from the compatibility service to the main Portal.
        # Must come from the same IP as the upload (same CI runner).
        # See: https://central.sonatype.org/publish/publish-portal-ossrh-staging-api/#ensuring-deployment-visibility
        if: success()
        env:
          MAVEN_CENTRAL_USERNAME: ${{ secrets.MAVEN_CENTRAL_USERNAME }}
          MAVEN_CENTRAL_PASSWORD: ${{ secrets.MAVEN_CENTRAL_PASSWORD }}
        run: |
          NAMESPACE="ch.trancee.meshlink"
          echo "Transferring staged deployment for namespace: $NAMESPACE"
          STATUS=$(curl -sS -o /tmp/transfer-status.txt -w '%{http_code}' \
            -u "$MAVEN_CENTRAL_USERNAME:$MAVEN_CENTRAL_PASSWORD" \
            -H "Accept: application/json" \
            -H "Content-Type: application/json" \
            -X POST \
            "https://ossrh-staging-api.central.sonatype.com/manual/upload/defaultRepository/$NAMESPACE")
          echo "Transfer to Central Portal status: $STATUS"
          echo "Response: $(cat /tmp/transfer-status.txt)"
          if [ "$STATUS" -ne 200 ] && [ "$STATUS" -ne 202 ]; then
            # Retry after a short wait - the staging repo may need time to register
            echo "First attempt failed, retrying in 10s..."
            sleep 10
            STATUS=$(curl -sS -o /tmp/transfer-status.txt -w '%{http_code}' \
              -u "$MAVEN_CENTRAL_USERNAME:$MAVEN_CENTRAL_PASSWORD" \
              -H "Accept: application/json" \
              -H "Content-Type: application/json" \
              -X POST \
              "https://ossrh-staging-api.central.sonatype.com/manual/upload/defaultRepository/$NAMESPACE")
            echo "Transfer retry status: $STATUS"
            echo "Response: $(cat /tmp/transfer-status.txt)"
          fi
          if [ "$STATUS" -ne 200 ] && [ "$STATUS" -ne 202 ]; then
            echo "::error::Failed to transfer deployment to Central Portal"
            exit 1
          fi
