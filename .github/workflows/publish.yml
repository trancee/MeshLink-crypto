name: Publish

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  publish:
    name: Publish to Maven Central (Central Portal)
    # macOS is required: iOS KMP targets (Kotlin/Native) need a Mac host.
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android SDK packages
        run: |
          sdkmanager --channel=3 \
            "platforms;android-37.0" "build-tools;37.0.0"

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Quality gate
        # Runs the full verification suite before any publishing:
        # ktfmt + detekt (constant-time lint) + kover (100% pure-K) +
        # abiValidation + JVM tests (Wycheproof + RFC KAT vectors).
        run: ./gradlew :crypto:check --rerun-tasks --no-build-cache

      - name: Validate PGP signing key
        # Verify SIGNING_KEY is a valid ASCII-armored PGP private key block
        # before the build step fails with a cryptic "Could not read PGP secret key".
        env:
          SIGNING_KEY: ${{ secrets.SIGNING_KEY }}
          SIGNING_KEY_PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD }}
        run: |
          if [ -z "$SIGNING_KEY" ]; then
            echo "::error::SIGNING_KEY secret is empty"
            exit 1
          fi
          if [ -z "$SIGNING_KEY_PASSWORD" ]; then
            echo "::error::SIGNING_KEY_PASSWORD secret is empty"
            exit 1
          fi
          # Normalize CRLF → LF (GitHub Actions secrets may carry Windows line endings)
          SIGNING_KEY=$(printf '%s' "$SIGNING_KEY" | tr -d '\r')
          # Verify the key has a PGP PRIVATE KEY BLOCK header
          first=$(printf '%s' "$SIGNING_KEY" | grep -m1 'BEGIN PGP PRIVATE KEY BLOCK')
          echo "Key header: $first"
          if [ -z "$first" ]; then
            echo "::error::SIGNING_KEY does not contain a PGP PRIVATE KEY BLOCK header"
            exit 1
          fi
          # Verify the key has a matching END marker
          if ! printf '%s' "$SIGNING_KEY" | grep -q 'END PGP'; then
            echo "::error::SIGNING_KEY is missing PGP block footer"
            exit 1
          fi
          echo "Key length: ${#SIGNING_KEY} characters"
          echo "PGP key format looks valid. Gradle signing plugin will validate further."
      - name: Build, sign, and bundle
        # Publishes all KMP publications (JVM, Android, iOS, KMP metadata)
        # with PGP signatures to a local file repository, then zips the
        # repo into central-bundle.zip for Central Portal upload.
        # Signing uses ORG_GRADLE_PROJECT_signingInMemoryKey / _Password
        # env vars — the build script wires these explicitly via useInMemoryPgpKeys().
        env:
          ORG_GRADLE_PROJECT_signingInMemoryKey: ${{ secrets.SIGNING_KEY }}
          ORG_GRADLE_PROJECT_signingInMemoryKeyPassword: ${{ secrets.SIGNING_KEY_PASSWORD }}
        run: |
          ./gradlew :crypto:publish :crypto:centralBundle \
            --rerun-tasks --no-build-cache

      - name: Authenticate to Central Portal
        id: auth
        # Central Portal User Token → Bearer token (skill §2)
        env:
          MAVEN_CENTRAL_USERNAME: ${{ secrets.MAVEN_CENTRAL_USERNAME }}
          MAVEN_CENTRAL_PASSWORD: ${{ secrets.MAVEN_CENTRAL_PASSWORD }}
        run: |
          printf '%s:%s' "$MAVEN_CENTRAL_USERNAME" \
            "$MAVEN_CENTRAL_PASSWORD" \
            | base64 | tr -d '\n' > /tmp/bearer-token.txt

      - name: Upload bundle
        # POST /api/v1/publisher/upload (skill §3)
        # Returns 201 with body = deployment ID (plain-text UUID, NOT JSON)
        id: upload
        run: |
          URL="https://central.sonatype.com/api/v1/publisher/upload"
          TOKEN=$(cat /tmp/bearer-token.txt)
          HTTP_CODE=$(curl -sS -o /tmp/upload-response.txt -w '%{http_code}' \
            -X POST \
            -H "Authorization: Bearer $TOKEN" \
            -F bundle=@crypto/build/distributions/central-bundle.zip \
            "$URL?name=meshlink-crypto&publishingType=USER_MANAGED")
          echo "HTTP status: $HTTP_CODE"
          if [ "$HTTP_CODE" != "201" ]; then
            echo "::error::Upload failed (HTTP $HTTP_CODE): $(cat /tmp/upload-response.txt)"
            exit 1
          fi
          echo "Upload response: $(cat /tmp/upload-response.txt)"
          # Central Portal returns the deployment ID as a plain-text UUID
          ID=$(tr -d '[:space:]' < /tmp/upload-response.txt)
          echo "deployment_id=$ID" >> "$GITHUB_OUTPUT"

      - name: Wait for validation
        # Poll POST /api/v1/publisher/status?id=$ID (skill §4)
        # until the deployment reaches a terminal state.
        run: |
          ID="${{ steps.upload.outputs.deployment_id }}"
          echo "Polling deployment: $ID"
          for i in $(seq 1 120); do
            STATE=$(curl -sS -X POST \
              -H "Authorization: Bearer $(cat /tmp/bearer-token.txt)" \
              "https://central.sonatype.com/api/v1/publisher/status?id=$ID" \
              | jq -r '.deploymentState')
            echo "::notice::State: $STATE"
            case "$STATE" in
              VALIDATED)
                echo "Validation complete."
                exit 0
                ;;
              FAILED)
                echo "::error::Validation failed"
                curl -sS -X POST \
                  -H "Authorization: Bearer $(cat /tmp/bearer-token.txt)" \
                  "https://central.sonatype.com/api/v1/publisher/status?id=$ID" \
                  | jq .
                exit 1
                ;;
              PENDING|VALIDATING)
                sleep 10
                ;;
              *)
                echo "::warning::Unexpected state: $STATE"
                sleep 10
                ;;
            esac
          done
          echo "::error::Timeout waiting for validation"
          exit 1

      - name: Publish deployment (USER_MANAGED)
        # POST /api/v1/publisher/deployment/$ID (skill §5)
        # Transitions: VALIDATED -> PUBLISHING -> PUBLISHED
        id: publish
        run: |
          ID="${{ steps.upload.outputs.deployment_id }}"
          STATUS=$(curl -sS -o /dev/null -w '%{http_code}' \
            -X POST \
            -H "Authorization: Bearer $(cat /tmp/bearer-token.txt)" \
            "https://central.sonatype.com/api/v1/publisher/deployment/$ID")
          echo "Publish HTTP status: $STATUS"
          if [ "$STATUS" != "204" ]; then
            echo "::error::Publish call failed ($STATUS)"
            exit 1
          fi

      - name: Wait for publication
        # After publishing, poll until the deployment reaches PUBLISHED.
        run: |
          ID="${{ steps.upload.outputs.deployment_id }}"
          for i in $(seq 1 60); do
            STATE=$(curl -sS -X POST \
              -H "Authorization: Bearer $(cat /tmp/bearer-token.txt)" \
              "https://central.sonatype.com/api/v1/publisher/status?id=$ID" \
              | jq -r '.deploymentState')
            echo "::notice::State: $STATE"
            case "$STATE" in
              PUBLISHED)
                echo "Artifact published to Maven Central."
                echo "Monitor: https://central.sonatype.com/publishing/deployments"
                echo "Verify: https://repo1.maven.org/maven2/ch/trancee/meshlink/"
                exit 0
                ;;
              FAILED)
                echo "::error::Publication failed"
                exit 1
                ;;
              *)
                sleep 10
                ;;
            esac
          done
          echo "::error::Timeout waiting for publication"
          exit 1
