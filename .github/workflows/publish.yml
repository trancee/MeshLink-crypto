name: Publish

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  publish:
    name: Publish to Maven Central
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
      - name: Install Android SDK packages
        run: |
          sdkmanager --channel=3 "platforms;android-37.0" "build-tools;37.0.0"
      - name: Grant execute permission for gradlew
        run: chmod +x gradlew
      - name: Validate PGP signing key
        env:
          SIGNING_KEY: ${{ secrets.SIGNING_KEY }}
        run: |
          if [ -n "$SIGNING_KEY" ]; then
            echo "SIGNING_KEY is set (length: ${#SIGNING_KEY})"
            echo "$SIGNING_KEY" | head -1
            echo "$SIGNING_KEY" | tail -1
            echo "$SIGNING_KEY" > /tmp/signing-key.pgp
            gpg --batch --import --import-options show-only /tmp/signing-key.pgp \
              && echo "PGP key is valid" \
              || echo "ERROR: PGP key is invalid or cannot be parsed"
          else
            echo "ERROR: SIGNING_KEY env var is not set"
            exit 1
          fi
      - name: Build and publish
        # Signing config is passed via env vars (not -P flags) because
        # SIGNING_KEY is a multi-line PGP key block that breaks shell
        # command line expansion. See: docs/how-to/get-started.md#publishing
        env:
          MAVEN_CENTRAL_USERNAME: ${{ secrets.MAVEN_CENTRAL_USERNAME }}
          MAVEN_CENTRAL_PASSWORD: ${{ secrets.MAVEN_CENTRAL_PASSWORD }}
          SIGNING_KEY: ${{ secrets.SIGNING_KEY }}
          SIGNING_KEY_PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD }}
        run: ./gradlew :crypto:publish
