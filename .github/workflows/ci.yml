name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    name: JVM + Android + iOS
    # macOS is required: iOS targets (Kotlin/Native) need a host that can
    # compile iOS binaries, and the Android SDK is installed below by
    # android-actions/setup-android.
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
      - name: Install Android SDK packages
        run: |
          sdkmanager --channel=3 "platforms;android-37.0" "build-tools;37.0.0"
      - name: Check (detekt + kover + abiValidation + spotless + JVM tests + iOS tests)
        run: ./gradlew check
      - name: Generate coverage + test summary (inline in GitHub Actions summary)
        if: always()
        run: python3 scripts/ci-summary.py
