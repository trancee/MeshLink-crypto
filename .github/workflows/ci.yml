name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    name: JVM + Android + iOS
    # macOS is required: iOS targets (Kotlin/Native) need a host that can
    # compile iOS binaries, and the Android SDK is installed below by
    # android-actions/setup-android.
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
      - name: Install Android SDK packages
        run: |
          sdkmanager --channel=3 "platforms;android-37.0" "build-tools;37.0.0"
      - name: Check (detekt + kover + abiValidation + spotless + JVM tests + iOS tests)
        run: ./gradlew check
      - name: Generate coverage + test summary (inline in GitHub Actions summary)
        if: always()
        run: python3 scripts/ci-summary.py

  android-matrix:
    name: Android API ${{ matrix.compile_sdk }}
    runs-on: ubuntu-latest
    # fail-fast: false so all API levels run even if one fails
    strategy:
      fail-fast: false
      matrix:
        # API 21 — minimum supported (JCA has SHA-256/512/HMAC, no X25519/Ed25519/CHACHA20)
        # API 28 — last before API 29 (same JCA availability as 21)
        # API 29 — first with native X25519/Ed25519/ChaCha20-Poly1305 in JCA
        # API 37 — latest stable (current default compileSdk)
        # Each entry maps to the correct sdkmanager package name:
        # older platforms use "platforms;android-XX", API 37+ uses ".0" suffix
        include:
          - compile_sdk: "21"
            platform_package: "platforms;android-21"
          - compile_sdk: "28"
            platform_package: "platforms;android-28"
          - compile_sdk: "29"
            platform_package: "platforms;android-29"
          - compile_sdk: "37"
            platform_package: "platforms;android-37.0"
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
      - name: Cache Gradle packages
        uses: actions/cache@v5
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
      - name: Install Android SDK packages
        run: |
          sdkmanager --channel=3 "${{ matrix.platform_package }}" "build-tools;37.0.0"
      - name: Compile Android + run JVM tests (compileSdk=${{ matrix.compile_sdk }})
        run: |
          ./gradlew :crypto:compileAndroidMain :crypto:jvmTest -PcompileSdkOverride=${{ matrix.compile_sdk }} --no-daemon --parallel
      - name: Generate test summary (inline in GitHub Actions summary)
        if: always()
        run: python3 scripts/ci-summary.py
