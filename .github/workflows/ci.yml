name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  lint:
    name: Markdown / YAML / Secret scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Setup JDK 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21
      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@v6
      - name: Install lychee
        run: |
          mkdir -p /tmp/lychee
          LYCHEE_RELEASE="https://github.com/lycheeverse/lychee/releases"
          LYCHEE_URL="${LYCHEE_RELEASE}/latest/download/lychee-x86_64-unknown-linux-gnu.tar.gz"
          curl -fsSL "$LYCHEE_URL" | tar -xz -C /tmp/lychee --strip-components=1
          sudo install -m 0755 /tmp/lychee/lychee /usr/local/bin/lychee
      - name: Install yamllint
        run: python3 -m pip install --user yamllint
      - name: Install gitleaks
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION=$(gh release view --repo gitleaks/gitleaks --json tagName --jq '.tagName')
          ASSET="gitleaks_${VERSION#v}_linux_x64.tar.gz"
          URL="https://github.com/gitleaks/gitleaks/releases/download/${VERSION}/${ASSET}"
          curl -fsSL "$URL" -o /tmp/gitleaks.tar.gz
          tar -xzf /tmp/gitleaks.tar.gz -C /tmp
          sudo install -m 0755 /tmp/gitleaks /usr/local/bin/gitleaks
          gitleaks version
      - name: Scan repository history for secrets
        run: gitleaks detect --source . --redact -v --config .gitleaks.toml
      - name: YAML lint
        run: yamllint .
      - name: Markdown lint + link check
        run: ./scripts/check-markdown.sh

  build:
    name: JVM + Android + iOS
    # macOS is required: iOS targets (Kotlin/Native) need a host that can
    # compile iOS binaries, and the Android SDK is installed below by
    # android-actions/setup-android.
    runs-on: macos-latest
    env:
      ORG_GRADLE_PROJECT_koverHtmlOnCheck: false
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21
      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
      - name: Install Android SDK packages
        run: |
          sdkmanager --channel=3 "platforms;android-37.0" "build-tools;37.0.0"
      - name: Check (detekt + kover + abiValidation + spotless + JVM tests + iOS tests)
        run: ./gradlew check --parallel
      - name: Generate coverage + test summary
        if: always()
        run: python3 scripts/ci-summary.py

  android-matrix:
    name: Android compileSdk=${{ matrix.compile_sdk }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # NOTE: KMP AGP 9.x does not auto-create androidInstrumentedTest source set.
        # Runtime dispatch on physical Android is verified via:
        # - DispatchVerificationTest (commonTest, runs on iOS simulator)
        # - PureKFallbackVerificationTest (commonTest, tests PureK directly)
        # - Wycheproof + RFC KAT vectors in jvmTest (correctness only)
        # Each entry maps to the correct sdkmanager package.
        # SDK 21-28: JCA lacks X25519/Ed25519/ChaCha20-Poly1305 → PureK at runtime.
        # SDK 29+: JCA supports all primitives natively.
        include:
          - compile_sdk: "21"
            platform_package: "platforms;android-21"
          - compile_sdk: "28"
            platform_package: "platforms;android-28"
          - compile_sdk: "29"
            platform_package: "platforms;android-29"
          - compile_sdk: "37"
            platform_package: "platforms;android-37.0"
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21
      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
      - name: Cache Gradle packages
        uses: actions/cache@v6
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
      - name: Install Android SDK packages
        run: |
          sdkmanager --channel=3 "${{ matrix.platform_package }}" "build-tools;37.0.0"
      - name: Verify Android compilation (compileSdk=${{ matrix.compile_sdk }})
        env:
          COMPILE_SDK: ${{ matrix.compile_sdk }}
        run: |
          ./gradlew :crypto:compileAndroidMain -PcompileSdkOverride=${{ matrix.compile_sdk }} --no-daemon --parallel
