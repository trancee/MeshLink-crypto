name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    name: JVM + Android + iOS
    # macOS is required: iOS targets (Kotlin/Native) need a host that can
    # compile iOS binaries, and the Android SDK is installed below by
    # android-actions/setup-android.
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          api-level: 37
          build-tools: 37.0.0
      - name: Check (detekt + kover + abiValidation + spotless + tests)
        run: ./gradlew check
