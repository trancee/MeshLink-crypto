name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    name: JVM + Android + iOS
    # macOS is required: iOS targets (Kotlin/Native) need a host that can
    # compile iOS binaries, and the Android SDK is installed below by
    # android-actions/setup-android.
    runs-on: macos-latest
    env:
      ORG_GRADLE_PROJECT_koverHtmlOnCheck: false
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
      - name: Install Android SDK packages
        run: |
          sdkmanager --channel=3 "platforms;android-37.0" "build-tools;37.0.0"
      - name: Check (detekt + kover + abiValidation + spotless + JVM tests + iOS tests)
        run: ./gradlew check --parallel
      - name: Generate coverage + test summary
        if: always()
        run: python3 scripts/ci-summary.py

  android-matrix:
    name: Android compileSdk=${{ matrix.compile_sdk }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # NOTE: KMP AGP 9.x does not auto-create androidInstrumentedTest source set.
        # Runtime dispatch on physical Android is verified via:
        # - DispatchVerificationTest (commonTest, runs on iOS simulator)
        # - PureKFallbackVerificationTest (commonTest, tests PureK directly)
        # - Wycheproof + RFC KAT vectors in jvmTest (correctness only)
        # Each entry maps to the correct sdkmanager package.
        # SDK 21-28: JCA lacks X25519/Ed25519/ChaCha20-Poly1305 → PureK at runtime.
        # SDK 29+: JCA supports all primitives natively.
        include:
          - compile_sdk: "21"
            platform_package: "platforms;android-21"
          - compile_sdk: "28"
            platform_package: "platforms;android-28"
          - compile_sdk: "29"
            platform_package: "platforms;android-29"
          - compile_sdk: "37"
            platform_package: "platforms;android-37.0"
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
      - name: Cache Gradle packages
        uses: actions/cache@v5
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
      - name: Install Android SDK packages
        run: |
          sdkmanager --channel=3 "${{ matrix.platform_package }}" "build-tools;37.0.0"
      - name: Verify Android compilation (compileSdk=${{ matrix.compile_sdk }})
        env:
          COMPILE_SDK: ${{ matrix.compile_sdk }}
        run: |
          ./gradlew :crypto:compileAndroidMain -PcompileSdkOverride=${{ matrix.compile_sdk }} --no-daemon --parallel
