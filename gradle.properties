# Gradle
org.gradle.jvmargs=-Xmx2046m -XX:MaxMetaspaceSize=512m -Dfile.encoding=UTF-8 -XX:+UseG1GC
org.gradle.caching=true
org.gradle.parallel=true
org.gradle.warning.mode=summary

# Kotlin
kotlin.code.style=official
# KGP 2.4.10 emits a benign DeprecatedGradleVersionWarning on Gradle 9.6.1; suppress it.
kotlin.suppressGradlePluginWarnings=DeprecatedGradleVersionWarning

# KMP noise suppressions (ticket 01).
# - ignoreDisabledTargets: silence "iosX64Test disabled on host" warnings.
# - suppressAgpWarnings=GENERIC: silence the KMP-android host-test opt-in warning.
kotlin.native.ignoreDisabledTargets=true
android.sync.suppressAgpWarnings=GENERIC
