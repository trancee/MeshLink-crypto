# crypto-kmp version catalog
# Kotlin KMP crypto library — toolchain-pinned per ADR-0007 / ticket 01.
#
# Binary compatibility: uses the Kotlin Gradle Plugin's BUILT-IN
# `kotlin { abiValidation {} }` (KGP 2.4.10) rather than the standalone
# BCV plugin, which has compatibility issues with AGP 9.x. See ADR-0007.

[versions]
kotlin = "2.4.10"
agp = "9.3.0"
detekt = "2.0.0-alpha.6"
kover = "0.9.9"
spotless = "8.9.0"
dokka = "2.2.0"

[plugins]
kotlinMultiplatform = { id = "org.jetbrains.kotlin.multiplatform", version.ref = "kotlin" }
# AGP 9.x: `com.android.library` is incompatible with KMP; use the dedicated
# Kotlin Multiplatform library plugin instead.
androidLibrary = { id = "com.android.kotlin.multiplatform.library", version.ref = "agp" }
detekt = { id = "dev.detekt", version.ref = "detekt" }
kover = { id = "org.jetbrains.kotlinx.kover", version.ref = "kover" }
spotless = { id = "com.diffplug.spotless", version.ref = "spotless" }
dokka = { id = "org.jetbrains.dokka", version.ref = "dokka" }

[libraries]
# Pure-K crypto — no third-party runtime dependencies by design (ADR-0005).
