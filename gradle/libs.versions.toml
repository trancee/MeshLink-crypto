# crypto-kmp version catalog
# Kotlin KMP crypto library — toolchain-pinned per ADR-0007 / ticket 01.
#
# Binary compatibility: uses the Kotlin Gradle Plugin's BUILT-IN
# `kotlin { abiValidation {} }` (KGP 2.4.10) rather than the standalone
# BCV plugin, which has compatibility issues with AGP 9.x. See ADR-0007.
[versions]
library = "0.1.0-SNAPSHOT"
kotlin = "2.4.10"
agp = "9.3.1"
detekt = "2.0.0-alpha.6"
kover = "0.9.9"
spotless = "8.9.0"
dokka = "2.2.0"
kotlinx-benchmark = "0.4.17"

[plugins]
kotlinMultiplatform = { id = "org.jetbrains.kotlin.multiplatform", version.ref = "kotlin" }
# AGP 9.x: `com.android.library` is incompatible with KMP; use the dedicated
# Kotlin Multiplatform library plugin instead.
androidLibrary = { id = "com.android.kotlin.multiplatform.library", version.ref = "agp" }
detekt = { id = "dev.detekt", version.ref = "detekt" }
kover = { id = "org.jetbrains.kotlinx.kover", version.ref = "kover" }
spotless = { id = "com.diffplug.spotless", version.ref = "spotless" }
dokka = { id = "org.jetbrains.dokka", version.ref = "dokka" }
# JVM subproject (host-only: compiles detekt custom rules).
kotlinJvm = { id = "org.jetbrains.kotlin.jvm", version.ref = "kotlin" }
kotlinxBenchmark = { id = "org.jetbrains.kotlinx.benchmark", version.ref = "kotlinx-benchmark" }
kotlinAllOpen = { id = "org.jetbrains.kotlin.plugin.allopen", version.ref = "kotlin" }

[libraries]
# Pure-K crypto — no third-party runtime dependencies by design (ADR-0005).
# Static-analysis host deps live under the `:crypto-detekt-rules` JVM subproject so the
# shipped `:crypto` KMP module stays dependency-free. (ADR-0007 / ticket 02.)
detekt-api = { module = "dev.detekt:detekt-api", version.ref = "detekt" }
detekt-test = { module = "dev.detekt:detekt-test", version.ref = "detekt" }
# Benchmark runtime — dev tooling only; not part of the shipped ABI.
kotlinxBenchmarkRuntime = { module = "org.jetbrains.kotlinx:kotlinx-benchmark-runtime", version.ref = "kotlinx-benchmark" }
