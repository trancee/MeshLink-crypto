# Config for lychee (link checker) — see scripts/check-markdown.sh and
# docs/how-to/run-checks.md.
#
# Checks all Markdown files for broken internal anchors and external URLs.
# Retries transient network failures before failing CI.
exclude_path = [
    ".agents/",
    ".git/",
    ".gradle/",
    ".kotlin/",
    # Generated ABI dump and build artifacts
    "crypto/api/",
    "crypto/build/",
    "build/",
]

exclude = [
    # GitHub release/tag/compare URLs for the current version are not live
    # until the tag is pushed (checked on local pre-push hook too).
    # Format: https://github.com/<owner>/<repo>/releases/tag/v*
    "^https://github\\.com/[^/]+/[^/]+/releases/tag/v[^/]+$",
    # Compare URLs with unreleased tags (fail before push).
    "^https://github\\.com/[^/]+/[^/]+/compare/v[^/]+\\.\\.\\.HEAD$",
]

# Retry transient network failures a few times before failing CI.
max_retries = 3
retry_wait_time = 2
timeout = 20

# Treat 429 (rate limit) as a source of retries, not an immediate failure.
accept = ["100..=103", "200..=299", "429"]
